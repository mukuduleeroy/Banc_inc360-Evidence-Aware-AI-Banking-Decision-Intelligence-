# Visual values generated from design_system.py; proposed student palette, not official bank tokens.
[theme]
base = "light"
primaryColor = "#1D3B6E"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#182B3B"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#10283F"
secondaryBackgroundColor = "#1D3B6E"
textColor = "#FFFFFF"
primaryColor = "#BDCDDD"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
